# Single domain:  /api/* and /up -> Laravel,  /assets/* -> SPA static files,  anything else -> SPA index.html
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/backend/public

    # Laravel public dir - only index.php is ever executed (no .htaccess lookups needed).
    <Directory /var/www/backend/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Built Vue SPA (vite build output)
    Alias /assets /var/www/spa/assets
    <Directory /var/www/spa>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Fingerprinted assets can be cached forever; index.html must not be cached.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    # Pass the Bearer token through to PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    RewriteEngine On

    # 1) API + health check -> Laravel front controller (URI kept, so Laravel sees /api/...)
    RewriteCond %{REQUEST_URI} ^/(api|up)(/|$)
    RewriteRule ^ /index.php [L]

    # 2) Real SPA assets are served by the Alias above
    RewriteRule ^/assets/ - [L]

    # 3) History-mode fallback: /tasks/123 etc. -> SPA index.html
    RewriteRule ^ /var/www/spa/index.html [L]

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
